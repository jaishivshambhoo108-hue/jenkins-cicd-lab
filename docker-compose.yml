services:

  jenkins:
    build:
      context: .
      dockerfile: jenkins/Dockerfile

    container_name: jenkins-server

    restart: unless-stopped

    user: root

    ports:
      - "8080:8080"
      - "50000:50000"

    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

    group_add:
      - "${DOCKER_GID}"

    networks:
      - ci-net

volumes:
  jenkins_home:

networks:
  ci-net:
    name: ci-net
    driver: bridge
